name: Check and release Viralogix
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: crackberryq/Viromics_FluPop
          ref: 180d6a6f9759c1a078e8ea8337025f1d3ee7a0d9
          path: .ci/flupop
      - run: |
          python -m venv .ci/flupop-env
          .ci/flupop-env/bin/python -m pip install snakemake==9.27.0
          echo "FLUPOP_TEST_SOURCE=$GITHUB_WORKSPACE/.ci/flupop" >> "$GITHUB_ENV"
          echo "FLUPOP_TEST_PYTHON=$GITHUB_WORKSPACE/.ci/flupop-env/bin/python" >> "$GITHUB_ENV"
      - run: python -m pip install -e '.[test]' build
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/build_windows_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: powershell
        run: ./tests/windows_desktop.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-preview
          path: windows-setup-preview.png
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: crackberryq/Viromics_FluPop
          ref: 180d6a6f9759c1a078e8ea8337025f1d3ee7a0d9
          path: .ci/flupop
      - run: |
          python -m venv .ci/flupop-env
          .ci/flupop-env/bin/python -m pip install snakemake==9.27.0
          echo "FLUPOP_TEST_SOURCE=$GITHUB_WORKSPACE/.ci/flupop" >> "$GITHUB_ENV"
          echo "FLUPOP_TEST_PYTHON=$GITHUB_WORKSPACE/.ci/flupop-env/bin/python" >> "$GITHUB_ENV"
      - run: python -m pip install -e '.[test]' playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: VIRALOGIX_BROWSER_TESTS=1 python -m pytest tests/test_browser.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-previews
          path: browser-artifacts/*
  pipeline-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: '3.12'
          activate-environment: manager-test
      - shell: bash -el {0}
        run: |
          python -m pip install -e .
          python tests/install_flupop_smoke.py
  publish:
    needs: [tests, windows-desktop, browser, pipeline-install]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: viralogix-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - run: python scripts/publish_release.py
        env:
          GH_TOKEN: ${{ github.token }}
